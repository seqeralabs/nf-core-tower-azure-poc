name: Rich-codex
on: [push]
jobs:
  rich_codex:
    runs-on: ubuntu-latest
    steps:

      - name: Check out the repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        
      - name: Install Tower-CLI 
        run: |
          TOWER_CLI_VERSION="0.6.3"
          curl -L https://github.com/seqeralabs/tower-cli/releases/download/v${TOWER_CLI_VERSION}/tw-${TOWER_CLI_VERSION}-linux-x86_64 > tw
          chmod +x ./tw
          mv tw /usr/local/bin/
        

      - name: Generate terminal images with rich-codex
        uses: ewels/rich-codex@f6d8165f6ab813603db81a49def997104f4fcd5a # v1
        env:
          TOWER_ACCESS_TOKEN: ${{ secrets.TOWER_ACCESS_TOKEN }}
        with:
          commit_changes: "true"
          clean_img_paths: assets/img/*.svg
